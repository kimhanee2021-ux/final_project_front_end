<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="AI 소비 코치 세나">
  <!-- GameSense AI 소비 코치 캐릭터 (직접 그린 일러스트, 외부 저작물 아님) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#35edbe"/>
    </linearGradient>
    <clipPath id="round"><circle cx="60" cy="60" r="60"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="120" height="120" fill="url(#bg)"/>
    <!-- 후드티 -->
    <path d="M18 124 C20 98 38 86 60 86 C82 86 100 98 102 124 Z" fill="#3a2f86"/>
    <path d="M48 88 L60 102 L72 88" fill="none" stroke="#e9e5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 목 -->
    <rect x="52" y="74" width="16" height="14" rx="6" fill="#f2c9a8"/>
    <!-- 얼굴 -->
    <circle cx="60" cy="56" r="24" fill="#f7d6bb"/>
    <!-- 머리카락 -->
    <path d="M35 58 C32 34 48 26 61 27 C76 27 89 36 85 58 C83 48 78 42 70 40 C66 46 56 48 46 46 C41 48 37 52 35 58 Z" fill="#2c2240"/>
    <!-- 눈 -->
    <ellipse cx="51" cy="58" rx="3.2" ry="3.8" fill="#2c2240"/>
    <ellipse cx="69" cy="58" rx="3.2" ry="3.8" fill="#2c2240"/>
    <circle cx="52.2" cy="56.6" r="1.1" fill="#ffffff"/>
    <circle cx="70.2" cy="56.6" r="1.1" fill="#ffffff"/>
    <!-- 볼 -->
    <ellipse cx="45" cy="66" rx="4.5" ry="2.6" fill="#ff9db0" opacity="0.55"/>
    <ellipse cx="75" cy="66" rx="4.5" ry="2.6" fill="#ff9db0" opacity="0.55"/>
    <!-- 웃는 입 -->
    <path d="M53 67 Q60 74 67 67" fill="none" stroke="#b5523b" stroke-width="2.6" stroke-linecap="round"/>
    <!-- 헤드셋 -->
    <path d="M33 56 C33 24 87 24 87 56" fill="none" stroke="#35edbe" stroke-width="5" stroke-linecap="round"/>
    <rect x="27" y="49" width="10" height="17" rx="5" fill="#35edbe" stroke="#1d8f75" stroke-width="1.5"/>
    <rect x="83" y="49" width="10" height="17" rx="5" fill="#35edbe" stroke="#1d8f75" stroke-width="1.5"/>
    <path d="M32 66 Q35 78 48 77" fill="none" stroke="#35edbe" stroke-width="3" stroke-linecap="round"/>
    <circle cx="49.5" cy="77" r="3.2" fill="#1d8f75"/>
  </g>
</svg>
